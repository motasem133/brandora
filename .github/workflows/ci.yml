name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: typecheck, lint, and a build that matches production's.
  #
  # The build needs a database. `/en` is statically prerendered and reads the
  # `plans` table for its pricing, so with an unreachable database the export
  # fails on that page rather than degrading — which is correct, because a
  # marketing page silently built without its prices would be worse. Vercel
  # builds against the real database for the same reason; this job now does
  # what production does instead of proving something easier.
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brandora
          POSTGRES_PASSWORD: brandora
          POSTGRES_DB: brandora
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: 'true'

      - run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: 'true'

      # Schema and plan rows, so the prerender of `/en` has prices to render.
      - name: Prepare the build database
        run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: postgresql://brandora:brandora@localhost:5432/brandora
          DATABASE_URL_UNPOOLED: postgresql://brandora:brandora@localhost:5432/brandora

      - run: pnpm build
        env:
          DATABASE_URL: postgresql://brandora:brandora@localhost:5432/brandora
          DATABASE_URL_UNPOOLED: postgresql://brandora:brandora@localhost:5432/brandora
          BETTER_AUTH_SECRET: build-time-placeholder-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:3100
          NEXT_PUBLIC_APP_URL: http://localhost:3100

      # Drizzle regenerates deterministically; a diff means a schema change
      # landed without its migration.
      - name: Check for missing migrations
        run: |
          pnpm drizzle-kit generate --config=./drizzle.config.ts
          if ! git diff --quiet drizzle/; then
            echo "::error::Schema changed without a generated migration. Run pnpm db:generate."
            git diff --stat drizzle/
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://brandora:brandora@localhost:5432/brandora

  test:
    name: System and browser tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brandora
          POSTGRES_PASSWORD: brandora
          POSTGRES_DB: brandora
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://brandora:brandora@localhost:5432/brandora
      DATABASE_URL_UNPOOLED: postgresql://brandora:brandora@localhost:5432/brandora
      BETTER_AUTH_SECRET: ci-secret-at-least-thirty-two-characters-long
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      TEST_BASE_URL: http://localhost:3100
      # No AI, storage or billing keys: neither suite calls an external
      # service. Anything that would has to be exercised deliberately.

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed plans and credit packs
        run: pnpm db:seed

      - run: pnpm build

      - name: Start the app
        run: |
          pnpm start --port 3100 &
          npx --yes wait-on http://localhost:3100/en --timeout 120000

      # Fixtures need the app running: the account is created through the real
      # sign-up endpoint so Better Auth owns the password hashing.
      - name: Seed test fixtures
        run: node scripts/seed-test-data.mjs

      - name: System tests
        run: node scripts/system-test.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm exec playwright test
        env:
          E2E_EMAIL: e2e@brandora-test.com
          E2E_PASSWORD: testpassword123

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
