# A flat node_modules, because file tracing cannot follow pnpm's symlinks.
#
# pnpm's default layout puts one symlink per direct dependency in node_modules
# and the real packages under .pnpm. Next's output file tracer walks real paths:
# it finds node_modules/sharp, and then cannot find @img/sharp-linux-x64 — which
# sharp resolves at runtime and no import statement ever names — because that
# package exists only inside .pnpm. The function shipped sharp's JavaScript and
# none of its binary:
#
#   Failed to load external module sharp-5843a61b03cbf433
#   ERR_DLOPEN_FAILED: libvips-cpp.so.8.18.3: cannot open shared object file
#
# Pointing outputFileTracingIncludes at .pnpm paths instead produced outputs
# Vercel would not deploy at all, three times. Hoisting is the supported way
# out: the layout becomes npm-shaped, every package sits at a real path, and
# tracing needs no special cases.
#
# It lives here rather than in .npmrc because pnpm 11 reads its settings from
# this file — the same trap that made `supportedArchitectures` below a no-op
# when it was first written into package.json.
nodeLinker: hoisted

# Binaries for the platform that runs this, as well as the one that builds it.
#
# sharp and @neplex/vectorizer ship per-platform native binaries as optional
# dependencies. A lockfile resolved on a Mac installs only darwin-arm64, so
# production loaded nothing and every logo run died with
# "ERR_DLOPEN_FAILED: libvips-cpp.so.8.18.3: cannot open shared object file"
# after the images had already been generated and paid for.
#
# `current` keeps development working on whatever machine is in front of you;
# `linux` + `x64` is what Vercel runs.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64

allowBuilds:
  '@parcel/watcher': true
  # Downloads the sentry-cli binary, which the build needs to upload source
  # maps. Without it a release build silently ships unreadable stack traces.
  '@sentry/cli': true
  '@swc/core': true
  # posthog-js pulls it in; its postinstall only prints a funding notice.
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
