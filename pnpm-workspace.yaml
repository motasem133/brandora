# A flat node_modules, kept now for the build rather than the runtime.
#
# This was added because Next's output file tracer walks real paths: it found
# node_modules/sharp and then could not find @img/sharp-linux-x64, which sharp
# resolves at runtime and no import ever names, because that package existed
# only inside .pnpm. The deployed function got sharp's JavaScript and none of
# its binary:
#
#   Failed to load external module sharp-5843a61b03cbf433
#   ERR_DLOPEN_FAILED: libvips-cpp.so.8.18.3: cannot open shared object file
#
# That specific problem is gone — nothing in the server runtime is native any
# more. This stays because the toolchain that *builds* the app still is
# (@swc/core, esbuild, unrs-resolver), an npm-shaped layout is what every one
# of them expects, and a working install is not worth re-litigating for a
# directory layout nobody looks at.
#
# It lives here rather than in .npmrc because pnpm 11 reads its settings from
# this file — the same trap that made `supportedArchitectures` below a no-op
# when it was first written into package.json.
nodeLinker: hoisted

# Binaries for the platform that runs this, as well as the one that builds it.
#
# Written for sharp and @neplex/vectorizer, which shipped per-platform binaries
# as optional dependencies: a lockfile resolved on a Mac installed only
# darwin-arm64, so production loaded nothing and every logo run died with
# "ERR_DLOPEN_FAILED: libvips-cpp.so.8.18.3: cannot open shared object file"
# after the images had already been generated and paid for.
#
# Both are gone from the server runtime, but this must stay: @swc/core and
# esbuild ship platform binaries the same way, and a build resolved on a Mac
# would install no Linux ones for them either. The failure would move from
# runtime to build time, not disappear.
#
# `current` keeps development working on whatever machine is in front of you;
# `linux` + `x64` is what Vercel runs.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64

allowBuilds:
  '@parcel/watcher': true
  # Downloads the sentry-cli binary, which the build needs to upload source
  # maps. Without it a release build silently ships unreadable stack traces.
  '@sentry/cli': true
  '@swc/core': true
  # posthog-js pulls it in; its postinstall only prints a funding notice.
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
